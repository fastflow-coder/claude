<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Bodega Burger{% endblock %} — Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <nav id="sidebar" class="d-flex flex-column p-3 text-white">
    <a href="/" class="brand text-white text-decoration-none mb-4">
      <i class="bi bi-fire me-2"></i>
      <span class="fw-bold fs-5">Bodega Burger</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a href="/" class="nav-link text-white {% if request.url.path == '/' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="/receipts" class="nav-link text-white {% if '/receipts' in request.url.path %}active{% endif %}">
          <i class="bi bi-receipt me-2"></i> Receipts
        </a>
      </li>
      <li class="nav-item">
        <a href="/stock" class="nav-link text-white {% if request.url.path == '/stock' %}active{% endif %}">
          <i class="bi bi-box-seam me-2"></i> Stock
          {% if low_stock_count > 0 %}
            <span class="badge bg-danger ms-1">{{ low_stock_count }}</span>
          {% endif %}
        </a>
      </li>
      <li class="nav-item">
        <a href="/income" class="nav-link text-white {% if request.url.path == '/income' %}active{% endif %}">
          <i class="bi bi-cash-coin me-2"></i> Income
        </a>
      </li>
      <li class="nav-item">
        <a href="/reports" class="nav-link text-white {% if request.url.path == '/reports' %}active{% endif %}">
          <i class="bi bi-bar-chart-line me-2"></i> Reports
        </a>
      </li>
    </ul>

    <hr class="border-secondary">
    <small class="text-secondary">Toronto, CA</small>
  </nav>

  <!-- Main content -->
  <div id="main-content" class="flex-grow-1">
    <!-- Top bar -->
    <div class="topbar d-flex align-items-center px-4 py-2 border-bottom">
      <h6 class="mb-0 fw-semibold">{% block title_text %}{% endblock %}</h6>
      <div class="ms-auto text-muted small">
        <i class="bi bi-calendar3 me-1"></i>
        <span id="today-date"></span>
      </div>
    </div>

    <div class="content-area p-4">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
  document.getElementById("today-date").textContent = new Date().toLocaleDateString("en-CA", {
    weekday: "short", year: "numeric", month: "short", day: "numeric"
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
